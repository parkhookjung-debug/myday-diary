<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<title>상몬의 작은 놀이터</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f5ee;color:#343b30;font:15px system-ui,-apple-system,sans-serif}main{max-width:1000px;margin:auto;padding:18px}h1{font-size:26px;margin:4px 0}p{line-height:1.5;color:#637058}.top,.bar,.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.top{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:20px}button{font:inherit;cursor:pointer;border:1px solid #d4d9c6;border-radius:14px;padding:12px 16px;background:#fff;color:inherit;touch-action:manipulation}button:hover,button:focus-visible{background:#e9efdb;outline:2px solid #81975e}button:disabled{opacity:.45;cursor:default}.card{text-align:left;min-height:126px;padding:20px}.card strong{display:block;font-size:18px;margin-bottom:6px}.card span{display:block;font-size:13px;color:#6b7660}.primary{background:#61774c;color:#fff}.bar{margin:12px 0}.bar strong{margin-right:auto}#stage{width:100%;display:block;border-radius:18px;border:1px solid #d9dfca;touch-action:none;background:#fcfbf5;max-height:65vh;object-fit:contain}#screen{position:relative}#veil{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:18px;background:#fcfbf5ef;padding:15px;text-align:center}#veil h2{font-size:24px;margin:5px}#veil p{margin:8px}.controls{justify-content:center;margin:12px 0}.controls button{min-width:56px;min-height:48px;touch-action:none;user-select:none;-webkit-user-select:none}#hint{min-height:42px;margin:8px 0}#status{min-height:24px;color:#855729;font-size:13px}.badge{border-radius:20px;background:#e7ecd8;padding:5px 10px}.hidden{display:none!important}@media(max-width:480px){main{padding:12px}.grid{grid-template-columns:1fr 1fr;gap:8px}.card{padding:12px;min-height:132px}.card strong{font-size:16px}h1{font-size:23px}#stage.tall{height:52vh;max-height:none}.bar button{padding:10px}.controls{gap:5px}.controls button{padding:10px;min-width:48px}}
</style></head><body><main>
<div class="top"><div><h1>상몬의 작은 놀이터</h1><p id="intro">잠깐 쉬어가는 일곱 가지 놀이. 기록과 경험치는 그대로예요.</p></div></div>
<section id="hub"><div class="grid" id="cards"></div><p>게임은 인터넷 없이 실행돼요. 최고 점수는 이 기기에 보관해요.<br>다른 앱으로 이동하면 자동으로 일시 정지해요.</p></section>
<section id="game" class="hidden"><div class="bar"><button id="back">‹ 놀이터</button><strong id="title"></strong><span class="badge" id="score">0점</span><span id="clock"></span><button id="pause">일시 정지</button></div>
<div id="screen"><canvas id="stage" width="960" height="600" aria-label="상몬 게임 화면"></canvas><div id="veil" class="hidden"></div></div>
<div id="hint" role="status" aria-live="polite"></div><div class="controls" id="controls"></div><div class="bar"><button id="restart">다시 시작</button><button id="export" disabled>결과 이미지 저장</button><span id="best"></span></div></section>
<div id="status" role="status" aria-live="polite"></div>
</main><script>/*RULES*/</script><script>/*ENGINE*/</script><script>/*VIEW*/</script></body></html>
