</main><script>window.MyDayMiniRules={"format": "myday-mini-games", "version": 1, "SlingSeconds": 60, "SlingShots": 10, "SlingGravity": 650, "SlingStrength": 8, "SlingMaxPull": 140, "FishSeconds": 60, "FishBiteWindow": 1.1, "FishWaitMin": 1.2, "FishWaitMax": 3.0, "FishZoneWidth": 0.25, "JumpSeconds": 60, "JumpLives": 3, "JumpGravity": 1800, "JumpLaunch": 690, "JumpSpeed": 280, "FetchSpeed": 380, "FetchRadius": 18, "FetchCatchRadius": 86, "BakeSeconds": 60, "BakeOrders": 8, "BakeHeatRate": 30, "BakeTargetWidth": 18, "BakePerfectWidth": 6, "BakeFeedbackSeconds": 0.9, "BakeGoodPoints": 30, "BakePerfectPoints": 50, "BlocksColumns": 10, "BlocksRows": 20, "BlocksFallSeconds": 0.85, "BlocksMinFallSeconds": 0.12, "BlocksLockSeconds": 0.4, "BlocksLinesPerLevel": 5, "BlocksPiecesPerSpeed": 5, "BlocksFallStep": 0.055};
window.MyDaySnackRules={"format": "myday-snack-game", "version": 1, "roundSeconds": 60, "startingLives": 3, "foodPoints": 10, "playerSpeed": 850, "invulnerableSeconds": 1.2, "hazardProbability": 0.32, "comboLength": 5, "comboBonus": 10};
window.MyDayPetRules={"PetMinThrowSpeed": 140, "PetMaxThrowSpeed": 5200, "PetGravity": 1150, "PetThrowGainPercent": 180, "PetRestitutionPercent": 72};</script><script>/* MyDay offline games. Rules match windows/Core; no storage, UI, diary XP or network here. */
(function(root) {

  }
  class Snack extends Round {
    constructor(seed) { super(seed,S.roundSeconds); this.x=this.target=480; this.lives=S.startingLives; this.drops=[]; this.spawn=.4; this.invulnerable=this.combo=this.maxCombo=this.eaten=0; }

  class Sling extends Round {

    begin(x,y) { if(this.state!=='playing'||!Number.isFinite(x)||!Number.isFinite(y)||this.flying||this.shots>=M.SlingShots||(x-this.x)**2+(y-this.y)**2>80**2)return;this.aiming=true;this.offset=[x-this.x,y-this.y]; }

    release() { if(!this.aiming)return;this.aiming=false;const dx=225-this.x,dy=450-this.y;if(Math.hypot(dx,dy)<12){this.reset();return;}this.vx=dx*M.SlingStrength;this.vy=dy*M.SlingStrength;this.flying=true;this.shots++; }

  class Fish extends Round {
    constructor(seed) { super(seed,M.FishSeconds);this.phase='idle';this.phaseTime=0;this.catches=this.perfects=0;this.zone=0;this.message='눌러서 낚싯줄을 던져요'; }

    }
    advance(h){this.phaseTime+=h;
      if(this.phase==='waiting'&&this.phaseTime>=this.wait){this.phase='bite';this.phaseTime=0;this.message='입질! 지금 눌러요!';}
      else if((this.phase==='bite'&&this.phaseTime>=M.FishBiteWindow)||(this.phase==='reeling'&&this.phaseTime>=4)||(this.phase==='caught'&&this.phaseTime>=1.4)){this.phase='idle';this.phaseTime=0;this.message='눌러서 다시 던져요';}

  }
  class Jump extends Round {
    constructor(seed){super(seed,M.JumpSeconds);this.height=this.velocity=0;this.lives=M.JumpLives;this.spawn=.9;this.items=[];this.invulnerable=this.cleared=this.eaten=0;}

    advance(h){
      this.invulnerable=Math.max(0,this.invulnerable-h);

  }
  class Bake extends Round {
    constructor(seed){super(seed,M.BakeSeconds);this.index=this.completed=this.cooked=this.perfects=this.heat=0;this.phase='ready';this.outcome='';}

    advance(h){if(this.phase==='heating'){this.heat=Math.min(100,this.heat+(M.BakeHeatRate+(this.index*7)%9-4)*h);if(this.heat>=100-1e-8){this.heat=100;this.finish('burnt');}}
      else if(this.phase==='feedback'){this.feedback-=h;if(this.feedback<=0){if(this.completed>=M.BakeOrders)this.state='finished';else{this.index=this.completed;this.heat=0;this.phase='ready';this.message='다음 간식도 구워봐요';}}}

  const tetrominos=[[[0,1],[1,1],[2,1],[3,1]],[[0,0],[0,1],[1,1],[2,1]],[[2,0],[0,1],[1,1],[2,1]],[[1,0],[2,0],[1,1],[2,1]],[[1,0],[2,0],[0,1],[1,1]],[[1,0],[0,1],[1,1],[2,1]],[[0,0],[1,0],[1,1],[2,1]]];
  class Blocks extends Round {
    constructor(seed){super(seed);this.board=Array.from({length:M.BlocksRows},()=>Array(M.BlocksColumns).fill(0));this.next=[];this.lines=this.pieces=0;this.spawn();}
    cells(kind=this.kind,rotation=this.rotation){let cells=tetrominos[kind].map(p=>p.slice());if(kind===3)return cells;for(let i=0;i<rotation;i++)cells=cells.map(([x,y])=>[(kind===0?4:3)-1-y,x]);return cells;}

    resetLock(grounded){if(grounded&&this.lockResets<15){this.lockClock=0;this.lockResets++;}}
    move(dx){if(this.state!=='playing'||![-1,1].includes(dx)||!this.fits(this.kind,this.rotation,this.x+dx,this.y))return;const grounded=!this.fits(this.kind,this.rotation,this.x,this.y+1);this.x+=dx;this.resetLock(grounded);}
    rotate(dx){if(this.state!=='playing'||this.kind===3)return;const r=(this.rotation+dx+4)%4,grounded=!this.fits(this.kind,this.rotation,this.x,this.y+1);for(const [x,y] of [[0,0],[-1,0],[1,0],[-2,0],[2,0],[0,-1],[-1,-1],[1,-1],[0,-2]]){if(this.fits(this.kind,r,this.x+x,this.y+y)){this.rotation=r;this.x+=x;this.y+=y;this.resetLock(grounded);return;}}}
    soft(){if(this.state==='playing'&&this.fits(this.kind,this.rotation,this.x,this.y+1)){this.y++;this.add(1);this.fallClock=0;}}

      const remaining=this.board.filter(row=>row.some(n=>!n));const n=M.BlocksRows-remaining.length;

  const puzzleShapes=[];

  class Puzzle extends Round {

   if(id==='bake'){pet(235,320,210,game.phase==='heating'?2:0);circle(650,290,80,game.outcome==='burnt'?'#646151':'#dfba8c');text(game.recipe,600,300,28,'#4b503a');rect(220,475,560,35,'#e4e9d7');rect(220+(game.target-9)*5.6,475,18*5.6,35,'#d6b862');rect(220,520,game.heat*5.6,10,'#ba8262',5);rect(220+game.heat*5.6-4,463,8,58,'#53653f',3);text(`${game.completed}/${MyDayMiniRules.BakeOrders} 접시 · ${Math.round(game.heat)}°`,360,425);}
   if(id==='blocks'){
    const phone=canvas.width===480,size=phone?30:26,ox=phone?28:350,oy=35;
    rect(ox-5,oy-5,size*10+10,size*20+10,'#e4e8dc');
    for(let y=0;y<20;y++)for(let x=0;x<10;x++){const n=game.board[y][x];if(n)cell(ox+x*size,oy+y*size,size,n);else rect(ox+x*size+1,oy+y*size+1,size-2,size-2,'#f7f8f0',3);}
    for(const[x,y]of game.cells()){if(y+game.ghost>=0)cell(ox+(game.x+x)*size,oy+(game.ghost+y)*size,size,game.kind+1,.23);if(y+game.y>=0)cell(ox+(game.x+x)*size,oy+(game.y+y)*size,size,game.kind+1);}
    text('다음 상몬',phone?345:650,70,phone?18:22);
    game.next.slice(0,3).forEach((kind,i)=>game.cells(kind,0).forEach(([x,y])=>cell((phone?345:655)+x*22,100+i*110+y*22,22,kind+1)));
    pet(phone?400:175,phone?510:420,phone?110:150);text(`${game.lines}줄 · Lv.${game.level}`,phone?345:90,phone?610:535,phone?17:22);
   }
   if(id==='block-puzzle'){
    const phone=canvas.width===480,size=52,ox=phone?32:272,oy=42;
    rect(ox-5,oy-5,426,426,'#e0e6d5');
    for(let y=0;y<8;y++)for(let x=0;x<8;x++){const n=game.board[y][x];if(n)cell(ox+x*size,oy+y*size,size,n);else rect(ox+x*size+2,oy+y*size+2,size-4,size-4,'#f8f9f2',8);}
    const piece=game.hand[selected];if(hover&&piece){const valid=game.can(piece,...hover);for(const[x,y]of piece.cells){const bx=x+hover[0],by=y+hover[1];if(bx>=0&&by>=0&&bx<8&&by<8)cell(ox+bx*size,oy+by*size,size,valid?piece.color+1:1,.35);}}
    game.hand.forEach((p,i)=>{const hx=phone?4+i*158:180+i*210;rect(hx,480,phone?150:190,106,i===selected?'#e6ecd8':'#f1f2e8');if(p)p.cells.forEach(([x,y])=>cell(hx+15+x*18,494+y*18,18,p.color+1,game.fits(p)?1:.35));});
    if(phone)text('블록을 고르고 보드를 눌러요',32,615,19);else{text('블록 선택 → 보드 터치',20,60,18);pet(125,290,150);}
   }
 }
 function frame(now){const dt=previous?Math.min(.25,(now-previous)/1000):0;previous=now;if(game){game.step(dt,axis);if(held&&game.state==='playing'){heldClock+=dt;if(heldClock>=.075){heldClock=0;held();}}scene();$('score').textContent=game.score+'점';$('clock').textContent=game.seconds?Math.ceil(game.left)+'초':'';$('hint').textContent=game.message||descriptions[G.ids.indexOf(id)];if(game.state==='finished')finish();}requestAnimationFrame(frame);}
 cards();requestAnimationFrame(frame);bridge({type:'ready'});setTimeout(()=>{if(!initialized)$('status').textContent='게임 저장소 연결을 확인하고 있어요.';},5000);
})();
</script></body></html>
