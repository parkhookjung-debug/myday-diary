<div id="myday-example" class="viz-dotted-background">
  <div class="md-phone" aria-label="마이데이 앱 예시 화면">
    <div class="md-status"><span>9:41</span><span>▰ ▰ ▰</span></div>
    <main>
      <div class="md-brand">MY DAY</div>
      <h1>내 마음대로, 나의 하루</h1>
      <p class="md-sub">필요한 블록을 골라 나만의 일기를 만들어 보세요.</p>
      <div class="md-date"><button type="button" data-day="-1">‹ 이전</button><input type="date" aria-label="일기 날짜" value="2026-10-08"><button type="button" data-day="1">다음 ›</button></div>
      <div class="md-caption">예시 기록 · 미리보기에서 변경 가능</div>
      <section class="md-settings" aria-label="오늘의 분위기">
        <h2>오늘의 분위기</h2>
        <div class="md-options"><button type="button" data-theme="0" aria-pressed="true">크림</button><button type="button" data-theme="1" aria-pressed="false">숲</button><button type="button" data-theme="2" aria-pressed="false">라벤더</button></div>
        <div class="md-options"><button type="button" data-character="🐰" aria-label="토끼" aria-pressed="true">🐰</button><button type="button" data-character="🐱" aria-label="고양이" aria-pressed="false">🐱</button><button type="button" data-character="🐻" aria-label="곰" aria-pressed="false">🐻</button></div>
      </section>
      <div class="md-blocks"></div>
      <button type="button" class="md-add">+ 블록 추가</button>
      <section class="md-picker" hidden aria-label="블록 선택">
        <h2>어떤 블록을 넣을까요?</h2>
        <button type="button" data-add="text">✍ 글 일기</button><button type="button" data-add="todo">☑ 할 일</button><button type="button" data-add="habit">🌱 습관 체크</button><button type="button" data-add="emotion">🐰 감정처리반</button>
      </section>
      <p class="md-note">감정처리반은 감정을 적어 보관하는 공간입니다. AI 대화는 아직 제공하지 않습니다.</p>
      <div class="md-live" aria-live="polite"></div>
    </main>
    <div class="md-bottom"></div>
  </div>
  <style>
    #myday-example { padding: 20px 8px; }
    #myday-example .md-phone { color-scheme:light; --md-bg:#fff8f3; --md-ink:#29211d; --md-accent:#805c49; --md-soft:#f3e6df; max-width:390px; margin:auto; background:var(--md-bg); color:var(--md-ink); border:1px solid #d8cec7; border-radius:30px; overflow:hidden; font-family:"Segoe UI", "Malgun Gothic", sans-serif; font-size:14px; line-height:1.5; }
    #myday-example .md-status { display:flex; justify-content:space-between; padding:14px 24px 4px; font-size:12px; font-weight:500; }
    #myday-example main { padding:18px 20px 8px; }
    #myday-example .md-brand { color:var(--md-accent); font-weight:500; letter-spacing:1.5px; font-size:12px; }
    #myday-example h1 { font-size:23px; line-height:1.35; font-weight:500; margin:6px 0; }
    #myday-example h2 { font-size:16px; font-weight:500; margin:0 0 10px; }
    #myday-example .md-sub { margin:0; font-size:13px; }
    #myday-example button { font:inherit; color:var(--md-accent); background:transparent; border:0; padding:10px 9px; border-radius:10px; min-height:44px; }
    #myday-example button:disabled { opacity:.35; }
    #myday-example .md-date { display:flex; align-items:center; justify-content:space-between; gap:2px; margin-top:16px; }
    #myday-example .md-date input { font:inherit; color:var(--md-accent); background:transparent; border:0; width:140px; min-width:0; }
    #myday-example .md-caption { font-size:11px; margin:0 0 14px; color:#65554b; }
    #myday-example .md-settings { background:var(--md-soft); border-radius:20px; padding:16px; margin-bottom:14px; }
    #myday-example .md-options { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 0; }
    #myday-example .md-options button { border:1px solid #aa9587; padding:7px 12px; min-height:36px; border-radius:8px; }
    #myday-example .md-options button[aria-pressed="true"] { background:#e6d2c4; color:#35281f; border-color:#805c49; }
    #myday-example .md-block { background:#fff; border-radius:20px; padding:16px; margin-bottom:14px; }
    #myday-example label.md-field { display:block; position:relative; margin-top:14px; }
    #myday-example .md-field span { position:absolute; top:-10px; left:10px; padding:0 5px; background:#fff; font-size:12px; color:#66554b; }
    #myday-example textarea { width:100%; box-sizing:border-box; resize:vertical; border:1px solid #a3948a; border-radius:5px; padding:14px 12px 10px; background:#fff; color:var(--md-ink); font:inherit; font-size:16px; }
    #myday-example .md-check { display:flex; align-items:center; gap:12px; min-height:44px; }
    #myday-example .md-check input { width:19px; height:19px; accent-color:var(--md-accent); }
    #myday-example .md-actions { display:flex; gap:2px; margin-top:4px; }
    #myday-example .md-actions button:last-child { margin-left:auto; }
    #myday-example .md-emotion { margin:0 0 16px; font-size:13px; }
    #myday-example .md-add { width:100%; background:var(--md-accent); color:#fff; border-radius:24px; }
    #myday-example .md-picker { background:#fff; border-radius:20px; padding:16px; margin-top:12px; }
    #myday-example .md-picker button { display:block; width:100%; text-align:left; }
    #myday-example .md-note { font-size:11px; color:#65554b; margin:14px 0 0; }
    #myday-example .md-live { font-size:11px; color:#65554b; }
    #myday-example .md-bottom { width:90px; height:4px; border-radius:4px; background:#40332b; margin:16px auto 12px; }
    @media(max-width:360px) { #myday-example main { padding:16px 12px 8px; } #myday-example .md-date button { padding:10px 5px; } }
  </style>
  <script>
    (() => {
      const root = document.getElementById('myday-example');
      const phone = root.querySelector('.md-phone');
      const list = root.querySelector('.md-blocks');
      const date = root.querySelector('input[type="date"]');
      const picker = root.querySelector('.md-picker');
      let character = '🐰';
      let seq = 4;
      const entries = { '2026-10-08': [
        {id:1, type:'text', text:'오늘은 일기 앱의 첫 화면을 만들었다.\n작은 기능부터 하나씩 완성해 가고 싶다.', checked:false},
        {id:2, type:'todo', text:'안드로이드 스튜디오에서 앱 실행하기', checked:true},
        {id:3, type:'emotion', text:'새로운 걸 시작해서 설레지만 조금 걱정도 된다. 오늘 한 걸로 충분해!', checked:false}
      ] };
      const labels = {text:'오늘은 어떤 하루였나요?',todo:'해야 할 일',habit:'오늘 실천할 습관',emotion:'내 마음 기록'};
      const titles = () => ({text:'✍ 오늘의 일기',todo:'☑ 할 일',habit:'🌱 습관 체크',emotion:character+' 감정처리반'});
      const current = () => entries[date.value] || (entries[date.value] = []);
      function render() {
        list.replaceChildren();
        current().forEach((block,index) => {
          const card = document.createElement('section'); card.className='md-block';
          const heading=document.createElement('h2'); heading.textContent=titles()[block.type]; card.append(heading);
          if(block.type==='emotion') { const p=document.createElement('p');p.className='md-emotion';p.textContent='판단 없이 들어줄게. 지금 마음을 들려줘.';card.append(p); }
          const label=document.createElement('label');label.className='md-field';
          const hint=document.createElement('span');hint.textContent=labels[block.type];
          const input=document.createElement('textarea');input.rows=['text','emotion'].includes(block.type)?3:1;input.value=block.text;
          input.addEventListener('input',()=>{block.text=input.value;}); label.append(hint,input);card.append(label);
          if(['todo','habit'].includes(block.type)) {
            const checklabel=document.createElement('label');checklabel.className='md-check';
            const check=document.createElement('input');check.type='checkbox';check.checked=block.checked;
            const text=document.createElement('span');text.textContent=block.checked?'오늘 완료했어요':'완료하면 체크해 주세요';
            check.addEventListener('change',()=>{block.checked=check.checked;text.textContent=block.checked?'오늘 완료했어요':'완료하면 체크해 주세요';});
            checklabel.append(check,text);card.append(checklabel);
          }
          const actions=document.createElement('div');actions.className='md-actions';
          [['↑ 위로',-1],['↓ 아래로',1],['삭제',0]].forEach(([name,delta])=>{
            const button=document.createElement('button');button.type='button';button.textContent=name;
            button.disabled=delta!==0 && (index+delta<0 || index+delta>=current().length);
            button.addEventListener('click',()=>{
              if(delta===0) { if(button.dataset.confirm!=='yes') {button.dataset.confirm='yes';button.textContent='삭제 확인';return;} current().splice(index,1); }
              else {const removed=current().splice(index,1)[0];current().splice(index+delta,0,removed);}
              render();
            });actions.append(button);
          });card.append(actions);list.append(card);
        });
        if(!current().length) {const p=document.createElement('p');p.textContent='아직 비어 있는 하루 · 첫 블록을 추가해 보세요.';list.append(p);}
      }
      root.querySelectorAll('[data-theme]').forEach(button=>button.addEventListener('click',()=>{
        const themes=[['#fff8f3','#f3e6df'],['#f0f5ef','#e1eadd'],['#f3f0fa','#e9e2f4']];
        const colors=themes[Number(button.dataset.theme)];phone.style.setProperty('--md-bg',colors[0]);phone.style.setProperty('--md-soft',colors[1]);
        root.querySelectorAll('[data-theme]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));
      }));
      root.querySelectorAll('[data-character]').forEach(button=>button.addEventListener('click',()=>{
        character=button.dataset.character;root.querySelectorAll('[data-character]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));render();
      }));
      root.querySelector('.md-add').addEventListener('click',()=>{picker.hidden=!picker.hidden;});
      root.querySelectorAll('[data-add]').forEach(button=>button.addEventListener('click',()=>{current().push({id:seq++,type:button.dataset.add,text:'',checked:false});picker.hidden=true;render();}));
      date.addEventListener('change',()=>{if(date.value)render();});
      root.querySelectorAll('[data-day]').forEach(button=>button.addEventListener('click',()=>{const day=new Date((date.value||'2026-10-08')+'T12:00:00Z');day.setUTCDate(day.getUTCDate()+Number(button.dataset.day));date.value=day.toISOString().slice(0,10);render();}));
      render();
    })();
  </script>
</div>
