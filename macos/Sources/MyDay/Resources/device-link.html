<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MyDay · 기기 연결</title>
<style>body{margin:0;background:#f7f5f0;color:#343c32;font:16px system-ui;line-height:1.7}main{max-width:560px;margin:28px auto;padding:24px}h1{font-family:Georgia,serif}section{background:white;padding:22px;border-radius:18px;margin:18px 0}button{padding:12px 18px;border:0;border-radius:12px;background:#677354;color:white;font:inherit;cursor:pointer}input{display:block;margin:14px 0;max-width:100%}#status{white-space:pre-wrap}small{color:#66715f}</style>
<main><p>✳ my day</p><h1>기록을 옮겨 볼까요?</h1><p>같은 Wi-Fi에서 10분 동안 연결돼요. 받은 기록은 MyDay에서 확인한 뒤 가져오세요.</p>
<section><h2>이 기기로 받기</h2><button id="download">백업 다운로드</button><p>앱의 기기 연결 화면에 주소를 붙여 넣으면 앱 안에서도 받을 수 있어요.</p></section>
<section><h2>연결한 기기로 보내기</h2><input type="file" accept=".json,application/json" id="file"><button id="upload">선택한 백업 보내기</button><p>받는 기기에서 ‘도착한 기록 확인’을 눌러 적용해야 해요.</p></section>
<p id="status" role="status"></p><small>신뢰하는 같은 Wi-Fi에서 사용하세요. 임시 주소를 아는 기기가 백업에 접근할 수 있어요.</small></main>
<script>
const token=location.hash.slice(1);const status=document.getElementById('status');
async function call(path,options={}){const r=await fetch(path,{...options,headers:{Authorization:'Bearer '+token,...options.headers}});if(!r.ok)throw Error(await r.text()||'연결 주소와 시간을 확인해 주세요.');return r;}
document.getElementById('download').onclick=async()=>{try{const r=await call('/download');const blob=await r.blob();const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='MyDay-transfer.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),30000);status.textContent='받은 파일을 MyDay의 백업 복원에서 가져오세요.';}catch(e){status.textContent=e.message;}};
document.getElementById('upload').onclick=async()=>{const f=document.getElementById('file').files[0];if(!f){status.textContent='공통 백업 JSON을 선택해 주세요.';return;}if(f.size>134217728){status.textContent='128MB 이하로 선택해 주세요.';return;}if(!confirm('선택한 백업을 연결한 기기로 보낼까요?'))return;try{await call('/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:f});status.textContent='보냈어요. 받는 앱에서 도착한 기록을 확인해 주세요.';}catch(e){status.textContent=e.message;}};
</script></html>
