name: Android signed preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          cache-read-only: true
      - name: Prepare private distribution key
        env:
          KEY_BASE64: ${{ secrets.MYDAY_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEY_BASE64"
          printf '%s' "$KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/myday-preview.jks"
          chmod 600 "$RUNNER_TEMP/myday-preview.jks"
      - name: Build and check signed release
        env:
          MYDAY_ANDROID_KEYSTORE: ${{ runner.temp }}/myday-preview.jks
          MYDAY_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MYDAY_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          ./gradlew --no-daemon :app:assembleRelease :app:lintRelease :app:testReleaseUnitTest
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Remove private key
        if: always()
        run: rm -f "$RUNNER_TEMP/myday-preview.jks"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: myday-signed-${{ github.run_number }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/reports/
          if-no-files-found: error
          retention-days: 7
